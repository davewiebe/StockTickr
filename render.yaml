services:
  # Backend — Node/Express/Socket.io
  - type: web
    name: stocktickr-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        fromService:
          type: web
          name: stocktickr-client
          property: host
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Frontend — React (static site)
  - type: web
    name: stocktickr-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_SERVER_URL
        fromService:
          type: web
          name: stocktickr-server
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
